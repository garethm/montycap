trust_boundaries:

  User Browser Execution Environment:
    id: user-browser
    description: >
      The user's web browser tab executing the montycap application. All application code,
      state, and computation reside here. No server component exists outside this boundary.
    type: execution-environment
    tags:
    technical_assets_inside:
      - montycap-app
    trust_boundaries_nested:

  GitHub Cloud Platform:
    id: github-cloud
    description: >
      GitHub SaaS platform hosting the source code repository, CI/CD pipelines (GitHub Actions),
      and the GitHub Pages CDN. Multi-tenant infrastructure operated by GitHub/Microsoft.
    type: network-cloud-provider
    tags:
      - github
    technical_assets_inside:
      - github-repo
      - github-actions
      - github-pages
    trust_boundaries_nested:

  Third-Party Action Sources:
    id: third-party-action-sources
    description: >
      GitHub-hosted repositories operated by third parties (StepSecurity, Peaceiris, Aqua Security,
      TruffleHog Security, OpenSSF) whose actions are fetched and executed by the GitHub Actions
      runner. Distinct from GitHub-operated assets — these are external supply chain dependencies.
    type: network-cloud-provider
    tags:
      - github-actions
    technical_assets_inside:
      - harden-runner
      - actions-gh-pages
      - trivy-action
      - trufflehog
      - scorecard-action
    trust_boundaries_nested:

  Public CDN Network:
    id: public-cdn-network
    description: >
      Public internet CDN infrastructure serving Chart.js and PapaParse. Outside the
      application trust boundary; resources loaded via HTTPS with SRI verification.
    type: network-on-prem
    tags:
    technical_assets_inside:
      - chartjs-cdn
      - papaparse-cdn
      - npm-registry
    trust_boundaries_nested:

individual_risk_categories:

  CDN Supply Chain Compromise:
    id: cdn-supply-chain-compromise
    description: >
      Chart.js or PapaParse served from the CDN is replaced with a malicious version
      (e.g. via CDN account compromise or BGP hijacking). The malicious script executes
      in the user's browser with full access to the page.
    impact: >
      Arbitrary JavaScript execution in the user's browser session. Potential exfiltration
      of task configuration data, DOM manipulation, or keylogging.
    asvs: V14.2 - Dependency
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Third_Party_Javascript_Management_Cheat_Sheet.html
    action: Verify SRI hashes are current and match the pinned CDN versions on every dependency update.
    mitigation: >
      Subresource Integrity (SRI) with SHA-384 hashes prevents the browser from executing
      any script that does not match the pinned hash. CSP restricts script sources as defence-in-depth.
    check: Confirm integrity= attributes are present and correct on all CDN script tags.
    function: architecture
    stride: tampering
    detection_logic: SRI mismatch causes the browser to block script execution with a console error.
    risk_assessment: >
      Likelihood low — requires CDN compromise. Impact high if successful.
      Residual risk very low after SRI + CSP controls.
    false_positives: None expected for a correctly pinned SRI hash.
    model_failure_possible_reason: false
    cwe: 829
    risks_identified:
      CDN Supply Chain Compromise at Chart.js CDN:
        severity: high
        exploitation_likelihood: unlikely
        exploitation_impact: high
        data_breach_probability: possible
        data_breach_technical_assets:
          - montycap-app
        most_relevant_data_asset: task-configuration
        most_relevant_technical_asset: chartjs-cdn
        most_relevant_communication_link:
        most_relevant_trust_boundary:
        most_relevant_shared_runtime:
      CDN Supply Chain Compromise at PapaParse CDN:
        severity: high
        exploitation_likelihood: unlikely
        exploitation_impact: high
        data_breach_probability: possible
        data_breach_technical_assets:
          - montycap-app
        most_relevant_data_asset: imported-csv
        most_relevant_technical_asset: papaparse-cdn
        most_relevant_communication_link:
        most_relevant_trust_boundary:
        most_relevant_shared_runtime:

  XSS via Task Name Input:
    id: xss-task-name-input
    description: >
      A user manually enters a task name containing HTML/script payloads. If rendered via
      innerHTML the payload executes in the browser. Effectively self-XSS with no persistence
      or sharing mechanism.
    impact: >
      Script execution within the user's own browser session. Limited impact given no
      data transmission, but controls are warranted as defence-in-depth.
    asvs: V5.3 - Output Encoding and Injection Prevention
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/DOM_based_XSS_Prevention_Cheat_Sheet.html
    action: Audit all DOM rendering paths in src/ui.js to confirm textContent is used throughout.
    mitigation: >
      All user-supplied strings inserted via textContent or safe DOM APIs rather than innerHTML.
      CSP blocks inline script execution as defence-in-depth.
    check: Grep src/ui.js for innerHTML usage; confirm none operate on user-supplied data.
    function: development
    stride: tampering
    detection_logic: >
      Static analysis (ESLint) and code review can detect innerHTML usage on user-supplied strings.
    risk_assessment: Self-XSS only — likelihood and impact both low with no persistence or sharing.
    false_positives: innerHTML used on static developer-controlled strings is safe.
    model_failure_possible_reason: false
    cwe: 79
    risks_identified:
      XSS via Task Name at montycap Application:
        severity: low
        exploitation_likelihood: unlikely
        exploitation_impact: low
        data_breach_probability: improbable
        data_breach_technical_assets:
          - montycap-app
        most_relevant_data_asset: task-configuration
        most_relevant_technical_asset: montycap-app
        most_relevant_communication_link:
        most_relevant_trust_boundary:
        most_relevant_shared_runtime:

  CSV Import XSS:
    id: csv-import-xss
    description: >
      A malicious CSV file contains task fields with embedded HTML or script payloads.
      On import, if any rendering path uses innerHTML, the payload executes.
    impact: Script execution in the user's browser session.
    asvs: V5.3 - Output Encoding and Injection Prevention
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/DOM_based_XSS_Prevention_Cheat_Sheet.html
    action: Validate and sanitise all CSV field values before storing in application state.
    mitigation: >
      Input sanitisation on CSV import strips dangerous content. DOM API text rendering
      (textContent) provides defence-in-depth even if sanitisation is incomplete.
    check: Confirm CSV import validation rejects or strips HTML/script content.
    function: development
    stride: tampering
    detection_logic: Attempting to import a CSV with script tags in task name fields.
    risk_assessment: Higher likelihood than form-input XSS as CSV can bypass UI friction.
    false_positives: None expected.
    model_failure_possible_reason: false
    cwe: 79
    risks_identified:
      CSV Import XSS at montycap Application:
        severity: medium
        exploitation_likelihood: likely
        exploitation_impact: medium
        data_breach_probability: possible
        data_breach_technical_assets:
          - montycap-app
        most_relevant_data_asset: imported-csv
        most_relevant_technical_asset: montycap-app
        most_relevant_communication_link:
        most_relevant_trust_boundary:
        most_relevant_shared_runtime:

  CSV Export Formula Injection:
    id: csv-export-formula-injection
    description: >
      Exported CSV contains task names beginning with =, +, -, or @ which trigger
      formula execution when opened in Excel or Google Sheets. The impact is on the
      downstream spreadsheet application, not montycap itself.
    impact: >
      Arbitrary formula execution in the downstream spreadsheet application — potentially
      DDE command execution or data exfiltration from the spreadsheet context.
    asvs: V5.3 - Output Encoding and Injection Prevention
    cheat_sheet: https://owasp.org/www-community/attacks/CSV_Injection
    action: Prefix all exported task name and value fields to neutralise formula trigger characters.
    mitigation: Tab character prefix applied to task name fields before CSV serialisation.
    check: Export a task named "=cmd|' /C calc'!A0" and verify the prefix neutralises it.
    function: development
    stride: tampering
    detection_logic: Manual testing with formula trigger characters in task names.
    risk_assessment: >
      Delivery vehicle risk only — the impact is on downstream applications, not montycap.
      Implemented mitigation is straightforward and effective.
    false_positives: None expected.
    model_failure_possible_reason: false
    cwe: 1236
    risks_identified:
      Formula Injection via Exported CSV:
        severity: medium
        exploitation_likelihood: likely
        exploitation_impact: medium
        data_breach_probability: improbable
        data_breach_technical_assets:
          - montycap-app
        most_relevant_data_asset: exported-csv
        most_relevant_technical_asset: montycap-app
        most_relevant_communication_link:
        most_relevant_trust_boundary:
        most_relevant_shared_runtime:

  Simulation Complexity Denial of Service:
    id: simulation-complexity-dos
    description: >
      A crafted CSV import with an extreme number of task rows or extreme quantity values
      causes the simulation to consume excessive CPU and hang the browser tab.
    impact: Browser tab becomes unresponsive; user must force-close it.
    asvs: V11.1 - Business Logic Security
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Denial_of_Service_Cheat_Sheet.html
    action: Enforce maximum values for task count, quantity, and simulation run count.
    mitigation: Input complexity limits enforced during CSV import and form validation.
    check: Attempt to import a CSV with 1000 tasks each with quantity 9999 and verify rejection.
    function: development
    stride: denial-of-service
    detection_logic: CSV import with extreme values that would otherwise cause long-running loops.
    risk_assessment: >
      Attacker would need physical access to the browser or social engineering to deliver
      the CSV. Impact limited to single browser tab.
    false_positives: None expected.
    model_failure_possible_reason: false
    cwe: 400
    risks_identified:
      Simulation Complexity DoS via CSV Import:
        severity: medium
        exploitation_likelihood: likely
        exploitation_impact: medium
        data_breach_probability: improbable
        data_breach_technical_assets:
          - montycap-app
        most_relevant_data_asset: imported-csv
        most_relevant_technical_asset: montycap-app
        most_relevant_communication_link:
        most_relevant_trust_boundary:
        most_relevant_shared_runtime:

  Build Pipeline Supply Chain Attack:
    id: build-pipeline-supply-chain
    description: >
      A malicious GitHub Action, compromised action dependency (e.g. via a mutable tag), or
      poisoned npm package causes a tampered web/index.html to be built and deployed to GitHub Pages.
      The attack is silent — the built artifact appears to pass CI checks.
    impact: >
      Arbitrary JavaScript injected into web/index.html is served to all users on the next deployment.
      Every user who opens the application receives and executes the malicious code.
    asvs: V14.2 - Dependency
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/CI_CD_Security_Cheat_Sheet.html
    action: Audit all GitHub Actions for pinned SHAs; monitor Dependabot alerts for npm packages.
    mitigation: >
      All GitHub Actions are pinned to immutable commit SHAs (not mutable tags). Runner egress is
      audited via step-security/harden-runner. Dependabot monitors npm and Actions dependencies weekly.
      Trivy scans the filesystem for known vulnerabilities on every CI run.
    check: >
      Verify all uses: entries in workflow files reference a full 40-character SHA, not a tag.
      Verify Dependabot is configured for both github-actions and npm ecosystems.
    function: operations
    stride: tampering
    detection_logic: >
      Dependabot raises PRs for outdated or vulnerable dependencies. Trivy scans flag known CVEs.
      harden-runner audits unexpected outbound network calls from the runner.
    risk_assessment: >
      Likelihood low — requires compromise of an upstream action or npm package.
      Impact critical — would affect every user on next deployment.
      Residual risk low-medium after SHA pinning, Dependabot, and runner hardening.
    false_positives: None expected.
    model_failure_possible_reason: false
    cwe: 1357
    risks_identified:
      Supply Chain Attack via harden-runner:
        severity: high
        exploitation_likelihood: unlikely
        exploitation_impact: very-high
        data_breach_probability: possible
        data_breach_technical_assets:
          - github-actions
          - github-pages
        most_relevant_data_asset: built-artifact
        most_relevant_technical_asset: harden-runner
        most_relevant_communication_link:
        most_relevant_trust_boundary: third-party-action-sources
        most_relevant_shared_runtime:
      Supply Chain Attack via actions-gh-pages:
        severity: critical
        exploitation_likelihood: unlikely
        exploitation_impact: very-high
        data_breach_probability: possible
        data_breach_technical_assets:
          - github-actions
          - github-pages
        most_relevant_data_asset: built-artifact
        most_relevant_technical_asset: actions-gh-pages
        most_relevant_communication_link:
        most_relevant_trust_boundary: third-party-action-sources
        most_relevant_shared_runtime:
      Supply Chain Attack via trivy-action:
        severity: medium
        exploitation_likelihood: unlikely
        exploitation_impact: high
        data_breach_probability: possible
        data_breach_technical_assets:
          - github-actions
        most_relevant_data_asset: source-code
        most_relevant_technical_asset: trivy-action
        most_relevant_communication_link:
        most_relevant_trust_boundary: third-party-action-sources
        most_relevant_shared_runtime:
      Supply Chain Attack via trufflehog:
        severity: medium
        exploitation_likelihood: unlikely
        exploitation_impact: high
        data_breach_probability: possible
        data_breach_technical_assets:
          - github-actions
        most_relevant_data_asset: source-code
        most_relevant_technical_asset: trufflehog
        most_relevant_communication_link:
        most_relevant_trust_boundary: third-party-action-sources
        most_relevant_shared_runtime:
      Supply Chain Attack via scorecard-action:
        severity: medium
        exploitation_likelihood: unlikely
        exploitation_impact: high
        data_breach_probability: possible
        data_breach_technical_assets:
          - github-actions
        most_relevant_data_asset: source-code
        most_relevant_technical_asset: scorecard-action
        most_relevant_communication_link:
        most_relevant_trust_boundary: third-party-action-sources
        most_relevant_shared_runtime:

  Unauthorised Deployment via Branch Tampering:
    id: unauthorised-deployment
    description: >
      An attacker gains write access to the main branch or the gh-pages branch (via stolen
      credentials, a compromised GITHUB_TOKEN, or insufficient branch protection) and pushes
      a malicious built artifact that is served directly to all users.
    impact: >
      Arbitrary JavaScript served to all users via GitHub Pages on the next page load.
    asvs: V14.3 - Unintended Security Disclosure
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/CI_CD_Security_Cheat_Sheet.html
    action: >
      Enforce branch protection requiring pull request reviews for main. Restrict who can push
      to gh-pages. Scope GITHUB_TOKEN to the minimum required permissions.
    mitigation: >
      Branch protection on main requires PR review before merge (CODEOWNERS file enforces reviewer
      assignment). The deploy workflow's GITHUB_TOKEN is scoped to contents: write on the runner
      only; the token cannot be exfiltrated to create broader access. egress-policy audit limits
      unexpected outbound calls.
    check: >
      Verify main branch protection rules require at least one approving review.
      Verify the deploy workflow permissions block is explicit and minimal.
    function: operations
    stride: tampering
    detection_logic: >
      GitHub audit log records all pushes to protected branches and permission changes.
      harden-runner flags unexpected egress that could indicate token exfiltration.
    risk_assessment: >
      Likelihood low — requires credential compromise or branch protection misconfiguration.
      Impact critical — would serve malicious content to all users immediately.
      Residual risk low after branch protection and minimal token scope.
    false_positives: None expected.
    model_failure_possible_reason: false
    cwe: 284
    risks_identified:
      Unauthorised Deployment at GitHub Repository:
        severity: high
        exploitation_likelihood: unlikely
        exploitation_impact: very-high
        data_breach_probability: improbable
