        authentication: token
        authorization: technical-user
        tags:
        vpn: false
        ip_filtered: false
        readonly: false
        usage: devops
        data_assets_sent:
          - built-artifact
        data_assets_received:
      Run harden-runner:
        target: harden-runner
        description: Every workflow job invokes harden-runner as a pre-step to monitor runner egress.
        protocol: https
        authentication: token
        authorization: technical-user
        tags:
        vpn: false
        ip_filtered: false
        readonly: false
        usage: devops
        data_assets_sent:
          - source-code
          - built-artifact
        data_assets_received:
      Run actions-gh-pages:
        target: actions-gh-pages
        description: The deploy workflow invokes actions-gh-pages to push the built artifact to the gh-pages branch.
        protocol: https
        authentication: token
        authorization: technical-user
        tags:
        vpn: false
        ip_filtered: false
        readonly: false
        usage: devops
        data_assets_sent:
          - built-artifact
        data_assets_received:
      Run trivy-action:
        target: trivy-action
        description: The security-scan workflow invokes trivy-action to scan the filesystem for known CVEs.
        protocol: https
        authentication: token
        authorization: technical-user
        tags:
        vpn: false
        ip_filtered: false
        readonly: false
        usage: devops
        data_assets_sent:
          - source-code
          - npm-dependencies
        data_assets_received:
