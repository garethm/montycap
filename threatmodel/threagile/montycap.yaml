          - source-code
        data_assets_received:

  GitHub Repository:
    id: github-repo
    description: >
      GitHub-hosted source code repository (garethm/montycap). Stores source code, workflows,
      and the gh-pages branch containing the built artifact. Branch protection requires PRs for main.
    type: datastore
    usage: devops
    used_as_client_by_human: false
    out_of_scope: false
    justification_out_of_scope:
    size: service
    technology: sourcecode-repository
    tags:
      - github
    internet: true
    machine: serverless
    encryption: none
    owner: GitHub
    confidentiality: public
    integrity: critical
    availability: important
    justification_cia_rating: >
      Integrity is critical — the repository is the source of truth for what gets built and deployed.
      A tampered main branch or gh-pages branch would directly affect what users receive.
    multi_tenant: true
    redundant: true
    custom_developed_parts: false
    data_assets_processed:
      - source-code
      - built-artifact
    data_assets_stored:
      - source-code
      - built-artifact
    data_formats_accepted:
