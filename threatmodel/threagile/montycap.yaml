threagile_version: 1.0.0

title: montycap

date: 2026-05-25

author:
  name: Gareth Marshall
  homepage: github.com/garethm/montycap

management_summary_comment: >
  Browser-only Monte Carlo simulation tool for capacity planning. Runs entirely client-side
  as a single HTML file with no server component, no authentication, and no persistent storage.

business_criticality: operational

business_overview:
  description: >
    montycap is a self-contained browser application that runs Monte Carlo simulations
    for software project capacity planning. All computation occurs in the user's browser.
    There is no server, no backend API, and no network transmission of user data.

technical_overview:
  description: >
    A single HTML file assembled from JavaScript source. External dependencies (Chart.js,
    PapaParse) are loaded from public CDNs with Subresource Integrity pinning. All state
    is session-only and discarded on page close.

questions:
  Is there any server-side processing of user data?: "No. The application is a static HTML file; all processing occurs in the browser."
  Is user data transmitted over any network?: "No. Task configurations and simulation results remain in the browser session."
  Are there persistent data stores?: "No. All data is session-only."

abuse_cases:
  CDN Supply Chain Attack: >
    An attacker compromises the Chart.js or PapaParse CDN and serves a malicious script version.
    The script executes in the user's browser with full page access.
  Malicious CSV Import: >
    A user opens a crafted CSV file containing HTML/script payloads or formula injection characters,
    leading to XSS or downstream spreadsheet formula execution.
  Simulation Complexity DoS: >
    A crafted CSV with extreme task counts or quantity values causes the simulation loop to
    consume excessive CPU, hanging the browser tab.
  Build Pipeline Compromise: >
    A malicious GitHub Actions workflow, compromised action dependency, or poisoned npm package
    causes a tampered web/index.html to be deployed to GitHub Pages and served to all users.
  Unauthorised Deployment: >
    An attacker gains write access to the main or gh-pages branch and pushes a malicious built
    artifact that is served directly to users.

security_requirements:
  SRI Pinning: All CDN resources must use integrity= SHA-384 hashes to prevent supply chain compromise.
  Content Security Policy: A strict CSP must be present to restrict script execution to known sources.
  Safe DOM Rendering: User-supplied strings must be inserted via textContent, never innerHTML.
  CSV Input Validation: CSV imports must be validated and sanitised before being stored in application state.
  Formula Injection Hardening: Exported CSV fields must be prefixed to neutralise spreadsheet formula triggers.
  Complexity Limits: Maximum bounds on task count, quantity, and simulation runs must be enforced.
  Pinned Actions: All GitHub Actions must reference pinned commit SHAs, not mutable tags, to prevent supply chain compromise.
  Branch Protection: The main branch must require pull request reviews before merging; direct pushes must be blocked.
  Minimal Token Scope: The GITHUB_TOKEN granted to the deploy workflow must be scoped to the minimum required permissions.

tags_available:
  - browser
  - cdn
  - javascript
  - csv
  - chart.js
  - papaparse
  - github
  - github-actions
  - github-pages
  - npm

data_assets:

  Task Configuration:
    id: task-configuration
    description: Task names, effort estimates, skip probabilities, and capacity settings entered by the user. Session-only; never transmitted or persisted.
    usage: business
    origin: User
    owner: User
    quantity: few
    confidentiality: restricted
    integrity: operational
    availability: operational
    justification_cia_rating: Session-only data with no transmission. Restricted because it may reflect internal project plans.

  Imported CSV:
    id: imported-csv
    description: CSV files uploaded by the user containing task data. Parsed entirely in the browser.
    usage: business
    origin: User filesystem
    owner: User
    quantity: few
    confidentiality: restricted
    integrity: important
    availability: operational
    justification_cia_rating: Integrity is important because malicious CSV content is the primary injection vector.

  Simulation Results:
    id: simulation-results
    description: Monte Carlo simulation output — effort distributions, capacity risk metrics. Derived from task-configuration; session-only.
    usage: business
    origin: montycap application
    owner: User
    quantity: few
    confidentiality: restricted
    integrity: important
    availability: operational
    justification_cia_rating: Integrity matters as corrupted results would mislead planning decisions.

  Exported CSV:
    id: exported-csv
    description: CSV file produced by the export function, written to the user's filesystem. Contains task configuration data serialised for use in external tools. Leaves the system boundary.
    usage: business
    origin: montycap application
    owner: User
    quantity: few
    confidentiality: restricted
    integrity: important
    availability: operational
    justification_cia_rating: Integrity critical — exported CSV may be opened in spreadsheet applications where formula injection could execute.

  Source Code:
    id: source-code
    description: JavaScript source (src/simulation.js, src/ui.js), HTML template, build scripts, and GitHub Actions workflows stored in the GitHub repository.
    usage: devops
    origin: Developer
    owner: "@garethm"
    quantity: very-few
    confidentiality: public
    integrity: critical
    availability: important
    justification_cia_rating: >
      Source code is public. Integrity is critical — tampered source would produce a malicious
      built artifact deployed to all users. Availability important to maintain development velocity.

  Built Artifact:
    id: built-artifact
    description: The assembled web/index.html produced by the build pipeline and deployed to the gh-pages branch for serving via GitHub Pages.
    usage: devops
    origin: GitHub Actions build pipeline
    owner: "@garethm"
    quantity: very-few
    confidentiality: public
    integrity: critical
    availability: important
    justification_cia_rating: >
      The artifact is public (served to all users). Integrity is critical — a tampered artifact
      would execute malicious JavaScript in every user's browser.

  npm Dependencies:
    id: npm-dependencies
    description: Node.js build-time dependencies (vitest, fast-check, eslint, html-validate, etc.) fetched from the npm registry during CI. Not shipped in the built artifact; CDN libraries are pinned via SRI separately.
    usage: devops
    origin: npm registry
    owner: Open source maintainers
    quantity: few
    confidentiality: public
    integrity: important
    availability: operational
    justification_cia_rating: >
      Integrity is important — a compromised npm package could modify the build output or exfiltrate
      source code during CI. Dependabot monitors for known vulnerabilities.


technical_assets:

  montycap Application:
    id: montycap-app
    description: >
      Self-contained Monte Carlo capacity planning tool delivered as a single HTML file, typically
      served from GitHub Pages and executed entirely within the user's browser. Includes simulation
      engine (PERT/Beta distributions), CSV import/export via PapaParse, and chart visualisation
      via Chart.js. No server component; all state is session-only.
    type: process
    usage: business
    used_as_client_by_human: true
    out_of_scope: false
    justification_out_of_scope:
    size: application
    technology: web-application
    tags:
      - browser
      - javascript
      - csv
      - chart.js
      - papaparse
    internet: true
    machine: serverless
    encryption: none
    owner: "@garethm"
    confidentiality: restricted
    integrity: important
    availability: operational
    justification_cia_rating: >
      Processes user-supplied task data including CSV uploads. Restricted confidentiality as task
      names may reflect internal project plans. Integrity important as simulation errors would
      mislead capacity planning decisions.
    multi_tenant: false
    redundant: false
    custom_developed_parts: true
    data_assets_processed:
      - built-artifact
      - task-configuration
      - imported-csv
    data_assets_stored:
      - simulation-results
      - exported-csv
    data_formats_accepted:
      - csv
    communication_links:
      Deliver Simulation Results to User:
        target: user
        description: Simulation results rendered to the DOM and displayed in the browser.
        protocol: in-process-library-call
        authentication: none
        authorization: none
        tags:
        vpn: false
        ip_filtered: false
        readonly: false
        usage: business
        data_assets_sent:
          - simulation-results
        data_assets_received:
      Deliver Exported CSV to User:
        target: user
        description: Exported task configuration CSV delivered to the user via a Blob URL download.
        protocol: in-process-library-call
        authentication: none
        authorization: none
        tags:
        vpn: false
        ip_filtered: false
        readonly: false
        usage: business
        data_assets_sent:
          - exported-csv
        data_assets_received:
      Load Chart.js from CDN:
        target: chartjs-cdn
        description: Chart.js library loaded from CDN over HTTPS with SRI hash verification.
        protocol: https
        authentication: none
        authorization: none
        tags:
        vpn: false
        ip_filtered: false
        readonly: true
        usage: business
        data_assets_sent:
        data_assets_received:
      Load PapaParse from CDN:
        target: papaparse-cdn
        description: PapaParse library loaded from CDN over HTTPS with SRI hash verification.
        protocol: https
        authentication: none
        authorization: none
        tags:
        vpn: false
        ip_filtered: false
        readonly: true
        usage: business
        data_assets_sent:
        data_assets_received:

