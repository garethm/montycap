    type: process
    usage: devops
    used_as_client_by_human: false
    out_of_scope: false
    justification_out_of_scope:
    size: service
    technology: build-pipeline
    tags:
      - github
      - github-actions
      - npm
    internet: true
    machine: serverless
    encryption: none
    owner: GitHub
    confidentiality: public
    integrity: critical
    availability: important
    justification_cia_rating: >
      Integrity is critical — the build pipeline transforms source into the deployed artifact.
      A compromised pipeline could insert malicious code into web/index.html before deployment.
    multi_tenant: true
    redundant: false
    custom_developed_parts: true
    data_assets_processed:
      - source-code
      - npm-dependencies
      - built-artifact
    data_assets_stored:
    data_formats_accepted:
    communication_links:
      Fetch npm Dependencies:
        target: npm-registry
        description: npm ci fetches build-time dependencies from the npm registry during CI.
        protocol: https
        authentication: none
        authorization: none
        tags:
        vpn: false
        ip_filtered: false
        readonly: true
        usage: devops
        data_assets_sent:
        data_assets_received:
          - npm-dependencies
      Deploy to GitHub Pages:
        target: github-pages
        description: >
          The deploy workflow pushes the built artifact to the gh-pages branch via
