    type: external-entity
    usage: devops
    used_as_client_by_human: false
    out_of_scope: false
    justification_out_of_scope:
    size: component
    technology: tool
    tags:
      - github-actions
    internet: true
    machine: serverless
    encryption: none
    owner: StepSecurity
    confidentiality: public
    integrity: critical
    availability: important
    justification_cia_rating: >
      Integrity critical — executes in every job with full runner access. A compromised version
      could exfiltrate GITHUB_TOKEN or tamper with the workspace before build or deploy steps run.
    multi_tenant: true
    redundant: false
    custom_developed_parts: false
    data_assets_processed:
      - source-code
      - built-artifact
    data_assets_stored:
    data_formats_accepted:
    communication_links:

  peaceiris/actions-gh-pages:
