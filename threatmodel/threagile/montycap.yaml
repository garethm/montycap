    communication_links:

  trufflesecurity/trufflehog:
    id: trufflehog
    description: >
      Third-party GitHub Action (trufflesecurity/trufflehog @ 37b77001, pinned to main-branch SHA)
      used in security-scan.yml. Scans the full git history for verified secrets. Pinned to SHA;
      monitored by Dependabot. Note: comment references "main" rather than a release tag — SHA
      should be verified against a known release on each Dependabot update.
    type: external-entity
    usage: devops
    used_as_client_by_human: false
    out_of_scope: false
    justification_out_of_scope:
    size: component
    technology: tool
    tags:
