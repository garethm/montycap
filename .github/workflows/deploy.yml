name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to gh-pages branch
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Build
      run: npm run build

    - name: Validate HTML
      run: |
        npx html-validate web/index.html

    - name: Security headers check
      run: |
        # Check for potential security issues in HTML
        if grep -i "javascript:" web/index.html; then
          echo "Warning: Found javascript: protocol usage"
          exit 1
        fi

        if grep -i "eval(" web/index.html; then
          echo "Warning: Found eval() usage"
          exit 1
        fi

        if grep -i "innerHTML.*+.*[\"']" web/index.html; then
          echo "Warning: Found potential XSS vulnerability with innerHTML concatenation"
          exit 1
        fi

    - name: Prepare deployment directory
      run: |
        mkdir -p dist
        cp web/index.html dist/
        cp LICENSE dist/ 2>/dev/null || true
        cp README.md dist/ 2>/dev/null || true

    - name: Deploy to gh-pages
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        publish_branch: gh-pages
        force_orphan: true
